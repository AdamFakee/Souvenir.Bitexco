plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.paymentportable'
version = '0.7.10'

android {
  namespace "expo.modules.paymentportable"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  
  // Khai báo file jar của Ingenico 
  implementation files('libs/ecr-client-1.03.jar')

  // Các thư viện mạng và JSON phụ trợ mà SDK yêu cầu
  implementation 'io.ktor:ktor-client-core:1.6.7'
  implementation 'io.ktor:ktor-client-cio:1.6.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.2'
}
